<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Códigos de Revisão · Porsche Center Brasília</title>
<style>
:root{
  --bg:#f4f4f4;--card:#fff;--ink:#0e0e12;--muted:#6b6d70;--line:#e6e6e8;--chip:#e8e8ea;--red:#d5001c;--ok:#0a7a3e;--warn:#b25e00;
  --font:"Porsche Next","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:16px/1.5 var(--font);font-weight:400;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.only-edit{display:none!important}
body.editing .only-edit{display:inline-flex!important}
body.editing .only-edit.block{display:block!important}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:#fff}
header.top .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.menu-btn{justify-self:start;display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font-size:16px;padding:8px 4px}
.menu-btn svg{width:22px;height:22px}
.brand{text-align:center;text-decoration:none;line-height:1.05}
.brand b{display:block;font-size:clamp(15px,2vw,20px);letter-spacing:.42em;margin-right:-.42em;font-weight:700}
.brand span{display:block;font-size:10px;letter-spacing:.5em;margin-right:-.5em;color:var(--muted);margin-top:5px}
.tools{justify-self:end;display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer}
.icon-btn:hover{background:var(--bg)}
.icon-btn svg{width:22px;height:22px}
.edit-pill{display:none;align-items:center;gap:8px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:999px;padding:4px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
body.editing .edit-pill{display:inline-flex}
body.editing header.top{box-shadow:inset 0 -3px 0 var(--red)}
#sbar{display:none;border-top:1px solid var(--line);background:#fff}
#sbar.open{display:block}
#sbar input{width:100%;height:68px;border:0;font-size:clamp(20px,3vw,30px);font-weight:300;background:transparent;outline:none}
#sbar input::placeholder{color:#a5a7ab}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,14,18,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,90vw);background:#fff;z-index:60;transform:translateX(-104%);transition:transform .3s cubic-bezier(.2,.7,.2,1);padding:26px 34px 40px;overflow:auto;visibility:hidden}
.drawer.open{transform:none;visibility:visible;box-shadow:0 0 60px rgba(0,0,0,.25)}
.drawer .close{position:absolute;right:16px;top:18px}
.drawer h2{font-size:22px;font-weight:600;margin:56px 0 18px}
.radio{display:flex;align-items:center;gap:14px;padding:9px 0;text-decoration:none;font-size:18px;font-weight:300}
.radio i{width:30px;height:30px;border-radius:50%;background:var(--chip);position:relative;flex:none;transition:.15s}
.radio:hover i{background:#d6d6d9}
.radio.on i{background:#fff;box-shadow:inset 0 0 0 7px var(--ink)}
.radio.on i::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.radio small{color:var(--muted);font-size:16px}
.drawer hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.dlink{display:block;padding:10px 0;font-size:18px;font-weight:300;text-decoration:none}
.dlink:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:6px;text-decoration-thickness:2px}
.switch{display:flex;align-items:center;gap:12px;font-size:16px;cursor:pointer;user-select:none;padding:10px 0}
.switch i{width:44px;height:26px;border-radius:13px;background:#c9cacc;position:relative;transition:.15s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i::after{left:21px}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;cursor:pointer;font-size:16px;text-decoration:none;white-space:nowrap}
.btn:hover{background:#2b2c31}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:#e9e9eb}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:#fdecee}
.btn.sm{height:36px;padding:0 16px;font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 13px;font-size:14px;line-height:24px;white-space:nowrap}
.chip.dark{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- page head ---------- */
.head{padding:clamp(28px,5vw,64px) 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(36px,5.6vw,60px);line-height:1.08;font-weight:300;letter-spacing:-.01em}
.head p{margin:10px 0 0;font-size:clamp(20px,2.6vw,28px);font-weight:300;color:#2a2b30}
.crumbs{font-size:14px;color:var(--muted);padding-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink);text-decoration:underline}
.sub-h{font-size:26px;font-weight:300;margin:44px 0 0}

/* ---------- cards (estilo configurador) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:30px 32px;padding:36px 0 96px}
.pcard{position:relative;margin-top:92px}
.plink{display:flow-root;text-decoration:none;background:var(--card);border-radius:46px 46px 8px 8px;padding:0 32px 30px;transition:transform .25s,box-shadow .25s;min-height:150px}
.pcard:hover .plink{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.1)}
.pimg{height:178px;margin:-92px -14px 8px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.pimg img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s}
.pcard:hover .pimg img{transform:scale(1.04)}
.ph{width:100%;height:100%;display:grid;place-items:end center;position:relative}
.ph b{font-size:clamp(54px,7vw,84px);font-weight:200;letter-spacing:-.03em;color:#d3d3d6;line-height:1;padding-bottom:34px;text-align:center}
.ph b.long{font-size:38px;padding:0 20px 30px;line-height:1.1}
.ph::after{content:"";position:absolute;left:6%;right:6%;bottom:2px;height:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.16),transparent 70%)}
.ph em{position:absolute;top:8px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9a9ca1}
.ptitle{margin:14px 0 14px;font-size:clamp(24px,2.4vw,30px);font-weight:300;line-height:1.15}
.pedit{position:absolute;right:12px;top:-70px;z-index:3;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);background:#fff;cursor:pointer;font-size:13px;align-items:center;gap:6px}
.pedit:hover{background:var(--ink);color:#fff}
.pcard.addcard .plink{border:2px dashed #c4c5c9;background:transparent;border-radius:46px 46px 8px 8px;display:grid;place-items:center;min-height:250px;color:var(--muted);text-align:center;cursor:pointer;margin-top:0;padding:0 20px}
.pcard.addcard{margin-top:92px}
.pcard.addcard:hover .plink{border-color:var(--ink);color:var(--ink);box-shadow:none;transform:none}
.pcard.addcard b{display:block;font-size:48px;font-weight:200;line-height:1}
.empty{padding:56px 0;color:var(--muted);font-size:18px;font-weight:300}

/* ---------- busca ---------- */
.plist{background:#fff;border-radius:24px;overflow:hidden;margin-bottom:60px}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:16px 26px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow a{text-decoration:none}
.prow a:hover{text-decoration:underline}
.prow small{color:var(--muted);display:block}
.code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f0f0f2;padding:3px 9px;border-radius:6px;border:0;cursor:pointer}
button.code:hover{background:var(--ink);color:#fff}

/* ---------- modelo ---------- */
.mmeta{margin-top:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:30px 0 0;padding-bottom:4px;scrollbar-width:thin}
.pill{flex:none;border:0;background:var(--chip);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:15px;white-space:nowrap}
.pill:hover{background:#d9d9dc}
.pill.on{background:var(--ink);color:#fff}
.pill small{opacity:.65;margin-left:8px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding:26px 0 96px;align-items:start}
.mgrid.one{grid-template-columns:minmax(0,1fr)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.listcard{background:#fff;border-radius:24px;overflow:hidden}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:16px 16px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tr.sec td{background:#fafafa;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:14px 16px;color:#3a3b40}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.off td:not(.chk){opacity:.35}
td.chk{width:44px;padding-right:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);cursor:pointer}
.msum{position:sticky;top:96px;background:#fff;border-radius:24px;padding:26px}
.msum h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.msum .iv{font-size:26px;font-weight:300;margin:4px 0 16px;line-height:1.15}
.srow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.srow span:first-child{color:var(--muted)}
.msum .btn{width:100%;margin-top:12px}
.msum .btn:first-of-type{margin-top:18px}
.note{font-size:14px;color:var(--muted);margin:14px 2px 0}
.msg{border-left:3px solid var(--warn);background:#fff8ec;padding:12px 16px;font-size:14px;margin:0 0 18px;border-radius:0 8px 8px 0}
.switchline{margin:0 0 16px}

/* ---------- carrossel de anos ---------- */
.carwrap{margin-top:36px}
.car-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.carrow{display:flex;align-items:center;gap:12px 28px;flex-wrap:wrap}
.car{--cw:116px;--cg:8px;--ml:0px;--mr:0px;display:flex;align-items:center;gap:12px;max-width:100%;min-width:0}
.car-arrow{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid #cdcdd1;background:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,color .25s,border-color .25s,opacity .25s,transform .25s}
.car-arrow svg{width:18px;height:18px}
.car-arrow:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
.car-arrow:active:not(:disabled){transform:scale(.92)}
.car-arrow:disabled{opacity:.28;cursor:default}
.car-view{flex:0 1 auto;min-width:0;width:calc(5*var(--cw) + 4*var(--cg));overflow-x:auto;scrollbar-width:none;padding:2px 0 14px;margin-bottom:-12px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml),#000 calc(100% - var(--mr)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml),#000 calc(100% - var(--mr)),transparent 100%)}
.car-view::-webkit-scrollbar{display:none}
.car-track{position:relative;display:flex;gap:var(--cg);width:max-content}
.car-chip{position:relative;flex:none;width:var(--cw);height:48px;border:0;border-radius:999px;background:var(--chip);cursor:pointer;font-size:16px;padding:0 10px;transition:background .25s}
.car-chip:hover{background:#d8d8dc}
.car-chip span{position:relative;z-index:2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .4s}
.car-chip.on,.car-chip.on:hover{background:var(--chip)}
.car-chip.on span{color:#fff}
.car-thumb{position:absolute;left:0;top:0;height:48px;width:var(--cw);border-radius:999px;background:var(--ink);z-index:1;pointer-events:none;box-shadow:0 8px 18px rgba(14,14,18,.25);transition:transform .55s cubic-bezier(.22,1,.36,1),width .55s cubic-bezier(.22,1,.36,1)}
#mcontent.swap{animation:swapR .5s cubic-bezier(.22,1,.36,1)}
#mcontent.swap[data-dir=l]{animation-name:swapL}
@keyframes swapR{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes swapL{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@media (max-width:600px){.car{--cw:92px}.car-arrow{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){.car-thumb{transition:none}#mcontent.swap{animation:none}}

/* edição */
td input.cell,td select.cell,th input.cell,.field input,.field select{height:38px;border:1px solid transparent;border-radius:6px;padding:0 10px;background:transparent;width:100%}
td input.cell:hover,td select.cell:hover,th input.cell:hover{border-color:var(--line)}
td input.cell:focus,td select.cell:focus,th input.cell:focus{border-color:var(--ink);background:#fff;outline:none}
.matrix td:nth-child(1) input.cell{min-width:250px}
.matrix td:nth-child(2) input.cell{min-width:140px}
td input.cell.qty{width:76px;text-align:right}
.matrix th.ivh{min-width:170px;padding:8px}
.matrix th.ivh div{display:flex;gap:2px}
.matrix td.mk{text-align:center;width:90px}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:6px;font-size:18px}
.xbtn:hover{background:#fdecee;color:var(--red)}
.addrow td{padding:8px 16px}
.plan-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.plan-title{display:grid;grid-template-columns:1fr 180px;gap:14px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:#fff;color:var(--ink);height:42px}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.plan-title .field{margin:0}

/* dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(540px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh}
dialog::backdrop{background:rgba(14,14,18,.6)}
dialog form{padding:30px}
dialog h3{margin:0 0 4px;font-size:26px;font-weight:300}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:26px;flex-wrap:wrap}
dialog .acts .sp{margin-right:auto}
.imgprev{margin-top:8px;height:150px;border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px}
.imgprev img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.imgacts{display:flex;gap:8px;margin-top:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}

.panel{background:#fff;border-radius:24px;padding:28px;margin-bottom:20px}
.panel h3{margin:0 0 6px;font-size:22px;font-weight:300}
.panel p{margin:0 0 14px;color:var(--muted);font-size:15px}
.panel .acts{display:flex;gap:8px;flex-wrap:wrap}
ul.warns{margin:0;padding:0;list-style:none}
ul.warns li{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
ul.warns li:first-child{border-top:0}
ul.warns a{font-weight:600}
.cmeta{color:var(--muted);font-size:14px}

@media (max-width:900px){
  .mgrid{grid-template-columns:1fr}
  .msum{position:static}
  .plan-title{grid-template-columns:1fr}
  .menu-btn span{display:none}
  .brand span{display:none}
  .prow{grid-template-columns:1fr auto}
  .prow>:last-child{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>Menu</span>
      </button>
      <a class="brand" href="#/"><b>PORSCHE CENTER</b><span>BRASÍLIA</span></a>
      <div class="tools">
        <button class="edit-pill" id="editPill" title="Sair do modo edição">● Edição</button>
        <button class="icon-btn" id="searchBtn" aria-label="Buscar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="sbar"><div class="wrap"><input id="q" type="search" placeholder="Buscar modelo, código ou peça…" autocomplete="off" aria-label="Buscar"></div></div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" inert></aside>

<main id="app"></main>
<dialog id="dlg"><form id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ DADOS ============ */
/* PUB = versão publicada (gravada dentro deste HTML). Todos os visitantes veem PUB.
   Quem ativa o modo editor trabalha num rascunho local e usa "Publicar" para gerar um novo HTML. */
let PUB = JSON.parse(document.getElementById('seed').textContent);
const LS = 'pcb-codigos-v2';      // formato antigo (edições feitas antes do botão Publicar)
const DR = 'pcb-rascunho-v3';     // rascunho do editor
const EF = 'pcb-editor';          // este navegador é de um editor?
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=k=>v=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };
let EDITOR = lsGet(EF)==='1';
let db, dirty=false, saveTimer, storageOK=true;
function initData(){
  migrate(PUB); PUB.rev = PUB.rev||0;
  db = null;
  if(EDITOR){
    let dr=null;
    try{ dr = JSON.parse(lsGet(DR)); }catch(e){}
    if(!(dr&&dr.data&&dr.data.models)) dr=null;
    if(!dr){ // aproveita edições feitas antes do botão Publicar
      try{ const d=JSON.parse(lsGet(LS)); if(d&&d.models&&d.plans&&d.categories) dr={baseRev:PUB.rev,data:d,legacy:true}; }catch(e){}
    }
    if(dr && dr.baseRev!==PUB.rev && !confirm('Existe um rascunho salvo neste computador, feito sobre OUTRA versão publicada.\n\nOK = continuar com o rascunho\nCancelar = usar a versão publicada deste arquivo (o rascunho será descartado)')) dr=null;
    if(dr){ db=migrate(dr.data); if(dr.legacy) setTimeout(()=>toast('Suas edições anteriores foram carregadas como rascunho.'),400); }
  }
  if(!db) db = structuredClone(PUB);
  checkDirty();
}
const sig=o=>{ const c={...o}; delete c.rev; return JSON.stringify(c); };
function checkDirty(){ dirty = EDITOR && sig(db)!==sig(PUB); updatePill(); }
function updatePill(){ const p=document.getElementById('editPill'); if(p) p.textContent='● Edição'+(dirty?' · não publicado':''); }
function save(){
  if(!EDITOR) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!lsSet(DR)(JSON.stringify({baseRev:PUB.rev,data:db})) && storageOK){ storageOK=false; toast('Sem espaço para salvar o rascunho. Publique ou exporte um backup em Dados.'); }
    checkDirty();
  }, 150);
}
/* gera um novo HTML com os dados atuais gravados dentro dele */
function publishFile(){
  const next = structuredClone(db); next.rev = Date.now();
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#seed').textContent = JSON.stringify(next).replace(/</g,'\\u003c');
  c.querySelector('#app').innerHTML='';
  const dr=c.querySelector('#drawer'); dr.innerHTML=''; dr.className='drawer'; dr.setAttribute('inert',''); dr.setAttribute('aria-hidden','true');
  c.querySelector('#scrim').className='scrim'; c.querySelector('#sbar').className='';
  c.querySelector('#dlgForm').innerHTML=''; c.querySelector('#dlg').removeAttribute('open');
  const t=c.querySelector('#toast'); t.className='toast'; t.textContent='';
  c.querySelector('body').removeAttribute('class');
  const html='<!doctype html>\n'+c.outerHTML;
  const u=URL.createObjectURL(new Blob([html],{type:'text/html'})); const l=document.createElement('a'); l.href=u; l.download='index.html'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),3000);
  PUB = next; lsSet(DR)(JSON.stringify({baseRev:PUB.rev,data:db})); checkDirty();
  toast('Arquivo index.html gerado. Envie-o ao seu site para todos verem.');
}

/* ============ UTIL ============ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9);
const strip = s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fmtN = v=>(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
function pnum(s){ s=String(s).trim().replace(/\s/g,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isNaN(v)?null:v; }
const numIn = v=>v==null?'':String(v).replace('.',',');
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
const SECS = [['parts','Peças necessárias'],['recs','Recomendados'],['labor','Mão de obra']];
function copyText(text,msg){
  const done=()=>toast(msg||'Copiado.');
  const fb=()=>{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');done();}catch(e){toast('Não foi possível copiar.');} t.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(done,fb); else fb();
}
function fileToDataURL(file,maxW=1100){
  return new Promise((res,rej)=>{
    const rd=new FileReader(); rd.onerror=rej;
    rd.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const s=Math.min(1,maxW/im.width), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let u=c.toDataURL('image/webp',.86); if(!u.startsWith('data:image/webp')) u=c.toDataURL('image/png');
      res(u); }; im.src=rd.result; };
    rd.readAsDataURL(file);
  });
}

/* ============ ESTADO ============ */
const ui = { q:'', edByModel:{}, planByModel:{}, ivByPlan:{}, excl:new Set(), withRecs:false, edit:false };
const byId = (arr,id)=>arr.find(x=>x.id===id);
const planById = id=>byId(db.plans,id), modelById = id=>byId(db.models,id), catById = id=>byId(db.categories,id), famById = id=>byId(db.families,id);
const catOf = m=>catById(m.category), famOfCat = c=>c&&famById(c.family);
const modelsOfCat = id=>db.models.filter(m=>m.category===id);
const catsOfFam = id=>db.categories.filter(c=>c.family===id);
const modelsOfFam = id=>db.models.filter(m=>catById(m.category)?.family===id);
/* ---- anos (edições de cada versão) ---- */
const yearKey = l=>{ const x=String(l||'').match(/\d{4}/); return x?+x[0]:null; };
function migrate(d){
  for(const m of d.models){
    if(!m.editions) m.editions=[{id:'e-'+m.id,label:m.years||'—',planIds:m.planIds||[]}];
    delete m.planIds;
  }
  return d;
}
function eds(m){ return m.editions.map((e,i)=>({e,i})).sort((a,b)=>{ const ka=yearKey(a.e.label), kb=yearKey(b.e.label); if(ka==null&&kb==null) return a.i-b.i; if(ka==null) return 1; if(kb==null) return -1; return ka-kb||a.i-b.i; }).map(x=>x.e); }
function curEd(m){ const l=eds(m); let e=l.find(x=>x.id===ui.edByModel[m.id]); if(!e){ e=l[l.length-1]; if(e) ui.edByModel[m.id]=e.id; } return e||null; }
const edPlans = e=>(e?e.planIds:[]).map(planById).filter(Boolean);
const allPlanIds = m=>[...new Set(m.editions.flatMap(e=>e.planIds))];
const allPlans = m=>allPlanIds(m).map(planById).filter(Boolean);
function yearsText(m){ const l=eds(m); if(!l.length) return '—'; if(l.length===1) return l[0].label; const ks=l.map(e=>yearKey(e.label)).filter(k=>k!=null); if(!ks.length) return l.length+' anos'; const a=Math.min(...ks), b=Math.max(...ks); return a===b?String(a):a+' – '+b; }
function findEdOfPlan(pid){ for(const m of db.models) for(const e of m.editions) if(e.planIds.includes(pid)) return {m,e}; return null; }
function modelImage(m){ const c=catOf(m); return m.image || c?.image || famOfCat(c)?.image || ''; }

/* ============ ROTAS ============ */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [k,...r] = h.split('/'); const id = decodeURIComponent(r.join('/'));
  if(k==='f'&&id) return {name:'family',id};
  if(k==='c'&&id) return {name:'category',id};
  if(k==='m'&&id) return {name:'model',id};
  if(k==='insumos') return {name:'insumos'};
  if(k==='dados') return {name:'dados'};
  if(k==='editor') return {name:'editor'};
  return {name:'home'};
}
function currentFamilyId(){
  const r=route();
  if(r.name==='family') return r.id;
  if(r.name==='category') return catById(r.id)?.family;
  if(r.name==='model'){ const m=modelById(r.id); return m&&catOf(m)?.family; }
  return null;
}
function render(){
  const r = route();
  if(r.name==='editor'){ lsSet(EF)('1'); EDITOR=true; initData(); location.replace('#/dados'); return; }
  if(r.name==='dados' && !EDITOR){ location.replace('#/'); return; }
  if(!EDITOR) ui.edit=false;
  document.body.classList.toggle('editing', ui.edit);
  drawDrawer();
  const app = $('#app');
  if(ui.q.trim()){ app.innerHTML = viewSearch(); return; }
  if(r.name==='category' && !ui.edit){ const ms=modelsOfCat(r.id); if(ms.length===1){ location.replace('#/m/'+ms[0].id); return; } }
  app.innerHTML = r.name==='family'?viewFamily(r.id) : r.name==='category'?viewCategory(r.id) : r.name==='model'?viewModel(r.id) : r.name==='insumos'?viewInsumos() : r.name==='dados'?viewDados() : viewHome();
  if(r.name==='model'){ refreshSummary(); initCarousel(); }
}
window.addEventListener('hashchange',()=>{ closeDrawer(); render(); window.scrollTo(0,0); });

/* ============ DRAWER ============ */

function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('inert',''); d.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); }

/* ============ CARDS ============ */
function pcard({href,img,title,chips=[],editAct,editId,ph,phLabel}){
  const phHTML = `<div class="ph"><em class="only-edit">${phLabel||'Sem foto'}</em><b class="${(ph||'').length>5?'long':''}">${esc(ph||title.slice(0,4))}</b></div>`;
  return `<article class="pcard">
    <a class="plink" href="${href}"><div class="pimg">${img?`<img src="${esc(img)}" alt="${esc(title)}">`:phHTML}</div>
      <h3 class="ptitle">${esc(title)}</h3><div class="chips">${chips.map((c,i)=>`<span class="chip ${i===0?'dark':''}">${esc(c)}</span>`).join('')}</div></a>
    ${editAct?`<button class="pedit only-edit" data-act="${editAct}" data-id="${esc(editId)}">✎ Editar / foto</button>`:''}</article>`;
}
const addCard = (act,label,extra='')=>`<article class="pcard addcard only-edit block"><a class="plink" role="button" tabindex="0" data-act="${act}" ${extra}><span><b>+</b>${label}</span></a></article>`;
const yearsRange = ms=>ms.length===1?yearsText(ms[0]):'';
const plural = (n,s,p)=>`${n} ${n===1?s:p}`;

/* ============ VIEWS: navegação ============ */
function viewHome(){
  return `<div class="wrap"><div class="head"><div><h1>Visão geral do modelo</h1><p>Escolha o modelo para consultar os códigos de revisão e pastilhas</p></div></div>
  <div class="grid">${db.families.map(f=>{
    const cs=catsOfFam(f.id), ms=modelsOfFam(f.id);
    return pcard({href:'#/f/'+encodeURIComponent(f.id),img:f.image,title:f.name,ph:f.name,chips:[plural(cs.length,'categoria','categorias'),plural(ms.length,'versão','versões')],editAct:'editfam',editId:f.id});
  }).join('')}${addCard('newfam','Nova família')}</div></div>`;
}
function viewFamily(id){
  const f=famById(id); if(!f) return notFound();
  const cs=catsOfFam(id);
  return `<div class="wrap"><div class="crumbs"><a href="#/">Visão geral</a> / <span>${esc(f.name)}</span></div>
  <div class="head"><div><h1>Versões de modelos ${esc(f.name)}</h1><p>Escolha a categoria</p></div>
  <div class="only-edit" style="gap:8px"><button class="btn ghost sm" data-act="editfam" data-id="${esc(f.id)}">Editar família</button></div></div>
  <div class="grid">${cs.length?cs.map(c=>{
    const ms=modelsOfCat(c.id);
    return pcard({href:'#/c/'+encodeURIComponent(c.id),img:c.image||f.image,title:c.name,ph:c.name,chips:[ms.length?plural(ms.length,'versão','versões'):'Sem versões ainda',yearsRange(ms)].filter(Boolean),editAct:'editcat',editId:c.id});
  }).join(''):'<div class="empty">Nenhuma categoria ainda. Ative o modo edição para criar.</div>'}${addCard('newcat','Nova categoria',`data-fam="${esc(f.id)}"`)}</div></div>`;
}
function viewCategory(id){
  const c=catById(id); if(!c) return notFound(); const f=famOfCat(c); const ms=modelsOfCat(id);
  return `<div class="wrap"><div class="crumbs"><a href="#/">Visão geral</a> / <a href="#/f/${encodeURIComponent(f?.id||'')}">${esc(f?.name||'')}</a> / <span>${esc(c.name)}</span></div>
  <div class="head"><div><h1>${esc(c.name)}</h1><p>Escolha a versão</p></div><div class="only-edit"><button class="btn ghost sm" data-act="editcat" data-id="${esc(c.id)}">Editar categoria</button></div></div>
  <div class="grid">${ms.length?ms.map(m=>{
    const pl=allPlans(m), rev=pl.filter(p=>p.kind==='revisao').length, pad=pl.filter(p=>p.kind==='pastilhas').length;
    return pcard({href:'#/m/'+m.id,img:modelImage(m),title:m.name,ph:m.badge||m.name,chips:[yearsText(m),m.editions.length>1?`${m.editions.length} anos`:'',m.badge,rev?'Revisão':'',pad?'Pastilhas':''].filter(Boolean),editAct:'editmodel',editId:m.id});
  }).join(''):`<div class="empty">Ainda não há versões nesta categoria.</div>`}${addCard('newmodel','Nova versão',`data-cat="${esc(c.id)}"`)}</div></div>`;
}
const notFound = ()=>`<div class="wrap"><div class="head"><h1>Não encontrado</h1></div><p><a class="btn" href="#/">Voltar ao início</a></p></div>`;

/* ============ BUSCA ============ */
function viewSearch(){
  const q = strip(ui.q.trim()); const words=q.split(/\s+/);
  const ms = db.models.filter(m=>{ const c=catOf(m); const hay=strip([m.name,m.badge,m.editions.map(e=>e.label).join(' '),m.note,c?.name,famOfCat(c)?.name].join(' ')); return words.every(w=>hay.includes(w)); });
  const cs = db.categories.filter(c=>{ const hay=strip(c.name+' '+famOfCat(c)?.name); return words.every(w=>hay.includes(w)); });
  const hits=[];
  if(q.length>=2) for(const m of db.models) for(const pid of allPlanIds(m)){ const p=planById(pid); if(!p) continue; for(const [sec] of SECS) for(const it of p[sec]) if(strip(it.code).includes(q)||strip(it.desc).includes(q)) hits.push({m,p,it}); }
  return `<div class="wrap"><div class="head"><div><h1>Resultados para “${esc(ui.q.trim())}”</h1></div></div>
  ${cs.length?`<h2 class="sub-h">Categorias</h2><div class="grid" style="padding-bottom:30px">${cs.map(c=>pcard({href:'#/c/'+encodeURIComponent(c.id),img:c.image||famOfCat(c)?.image,title:c.name,ph:c.name,chips:[plural(modelsOfCat(c.id).length,'versão','versões')]})).join('')}</div>`:''}
  <h2 class="sub-h">Versões <span class="cmeta">(${ms.length})</span></h2>
  ${ms.length?`<div class="grid" style="padding-bottom:30px">${ms.map(m=>pcard({href:'#/m/'+m.id,img:modelImage(m),title:m.name,ph:m.badge||m.name,chips:[yearsText(m),m.badge].filter(Boolean)})).join('')}</div>`:'<div class="empty" style="padding:20px 0">Nenhuma versão encontrada.</div>'}
  ${q.length>=2?`<h2 class="sub-h" style="margin-bottom:20px">Peças e códigos <span class="cmeta">(${hits.length}${hits.length>60?' · mostrando 60':''})</span></h2>
  ${hits.length?`<div class="plist">${hits.slice(0,60).map(h=>`<div class="prow"><div><a href="#/m/${esc(h.m.id)}" data-plan="${esc(h.p.id)}">${esc(h.it.desc||'(sem descrição)')}</a><small>${esc(h.m.name)} ${esc(findEdOfPlan(h.p.id)?.e.label||'')} · ${esc(h.p.kind==='pastilhas'?h.p.label:'Revisão programada')}</small></div>${h.it.code?`<button class="code" data-act="copy" data-code="${esc(h.it.code)}" title="Copiar">${esc(h.it.code)}</button>`:'<span>—</span>'}<a class="cmeta" href="#/m/${esc(h.m.id)}" data-plan="${esc(h.p.id)}">Abrir →</a></div>`).join('')}</div>`:'<div class="empty" style="padding:20px 0">Nenhuma peça ou código encontrado.</div>'}`:''}</div>`;
}

/* ============ MODELO ============ */
function activePlan(m){
  const plans=edPlans(curEd(m));
  let id=ui.planByModel[m.id]; if(!plans.find(p=>p.id===id)) id=plans[0]?.id;
  ui.planByModel[m.id]=id; return plans.find(p=>p.id===id)||null;
}
function activeIv(p){ let iv=ui.ivByPlan[p.id]; if(!p.intervals.find(i=>i.key===iv)) iv=p.intervals[0]?.key; ui.ivByPlan[p.id]=iv; return iv; }
const mchipsHTML = m=>[curEd(m)?.label,m.badge,m.note].filter(Boolean).map((t,i)=>`<span class="chip ${i===0?'dark':''}">${esc(t)}</span>`).join('');
function viewModel(id){
  const m=modelById(id); if(!m) return notFound();
  const c=catOf(m), f=famOfCat(c);
  return `<div class="wrap">
  <div class="crumbs"><a href="#/">Visão geral</a> / <a href="#/f/${encodeURIComponent(f?.id||'')}">${esc(f?.name||'')}</a> / <a href="#/c/${encodeURIComponent(c?.id||'')}">${esc(c?.name||'')}</a> / <span>${esc(m.name)}</span></div>
  <div class="head"><div><h1>${esc(m.name)}</h1><div class="chips mmeta" id="mchips">${mchipsHTML(m)}</div></div>
    <div class="only-edit" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="editmodel" data-id="${esc(m.id)}">Editar versão</button><button class="btn ghost sm" data-act="dupmodel" data-id="${esc(m.id)}">Duplicar versão</button></div></div>
  ${carouselHTML(m)}
  <div id="mcontent">${contentHTML(m)}</div></div>`;
}
function contentHTML(m){
  const e=curEd(m), plans=edPlans(e), p=activePlan(m);
  return `<div class="tabs" role="tablist" aria-label="Plano">${plans.map(x=>`<button class="pill ${p&&x.id===p.id?'on':''}" role="tab" data-act="plan" data-id="${esc(x.id)}">${esc(x.kind==='pastilhas'?x.label:'Revisão programada')}${x.note?`<small>${esc(x.note)}</small>`:''}</button>`).join('')}
    <button class="pill only-edit" data-act="newplan">+ Novo plano</button><button class="pill only-edit" data-act="linkplan">Vincular existente</button></div>
  ${p?`<div class="mgrid ${ui.edit?'one':''}"><div class="mmain">${ui.edit?editorHTML(m,p):listHTML(m,p)}</div>${ui.edit?'':'<aside class="msum" id="summary"></aside>'}</div>`
     :`<div class="empty">Este ano (${esc(e?.label||'')}) ainda não tem planos. Ative o modo edição para criar ou vincular.</div>`}`;
}
function renderContent(m){ const mc=$('#mcontent'); if(!mc) return render(); mc.innerHTML=contentHTML(m); refreshSummary(); }

/* ---- carrossel de anos ---- */
const chev = d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
function carouselHTML(m){
  const l=eds(m), cur=curEd(m);
  return `<section class="carwrap" aria-label="Ano do modelo"><div class="car-label">Ano do modelo</div>
  <div class="carrow"><div class="car" id="car">
    <button class="car-arrow" data-act="carprev" aria-label="Anos anteriores">${chev('M15 5l-7 7 7 7')}</button>
    <div class="car-view" id="carView" role="tablist" aria-label="Anos disponíveis"><div class="car-track" id="carTrack"><span class="car-thumb" id="carThumb" aria-hidden="true"></span>
      ${l.map(e=>`<button class="car-chip ${e.id===cur?.id?'on':''}" role="tab" aria-selected="${e.id===cur?.id}" data-act="ed" data-id="${esc(e.id)}" title="${esc(e.label)}"><span>${esc(e.label)}</span></button>`).join('')}</div></div>
    <button class="car-arrow" data-act="carnext" aria-label="Próximos anos">${chev('M9 5l7 7-7 7')}</button></div>
    <div class="only-edit" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="newed">+ Adicionar ano</button><button class="btn ghost sm" data-act="edited">Renomear / excluir ano</button></div></div></section>`;
}
function placeThumb(animate){
  const th=$('#carThumb'), on=$('#carTrack .car-chip.on'); if(!th||!on) return;
  if(!animate) th.style.transition='none';
  th.style.width=on.offsetWidth+'px'; th.style.transform=`translateX(${on.offsetLeft}px)`;
  if(!animate){ void th.offsetWidth; th.style.transition=''; }
}
function ensureVisible(chip,animate){
  const v=$('#carView'); if(!v||!chip) return; const pad=18;
  let left=null;
  if(chip.offsetLeft < v.scrollLeft+pad) left=chip.offsetLeft-pad-(chip.offsetWidth+8)*(animate?1:0);
  else if(chip.offsetLeft+chip.offsetWidth > v.scrollLeft+v.clientWidth-pad) left=chip.offsetLeft+chip.offsetWidth-v.clientWidth+pad+(chip.offsetWidth+8)*(animate?1:0);
  if(left!=null) v.scrollTo({left:Math.max(0,left),behavior:animate?'smooth':'auto'});
}
function centerChip(){ const v=$('#carView'), on=$('#carTrack .car-chip.on'); if(!v||!on) return; v.scrollTo({left:Math.max(0,on.offsetLeft-(v.clientWidth-on.offsetWidth)/2),behavior:'auto'}); }
function carState(){
  const v=$('#carView'), car=$('#car'); if(!v||!car) return;
  const max=v.scrollWidth-v.clientWidth, x=v.scrollLeft;
  car.style.setProperty('--ml',x>2?'44px':'0px'); car.style.setProperty('--mr',x<max-2?'44px':'0px');
  const [p,n]=$$('.car-arrow',car); p.disabled=x<=2; n.disabled=x>=max-2;
}
function initCarousel(){
  const v=$('#carView'); if(!v) return;
  centerChip(); placeThumb(false); carState();
  v.addEventListener('scroll',carState,{passive:true});
}
function carPage(dir){
  const v=$('#carView'), c=$('.car-chip',v); if(!v||!c) return;
  const w=c.offsetWidth+8, n=Math.max(1,Math.floor((v.clientWidth+8)/w));
  v.scrollTo({left:Math.max(0,Math.min(v.scrollWidth-v.clientWidth,Math.round(v.scrollLeft/w)*w+dir*n*w)),behavior:'smooth'});
}
function switchEd(m,id,fromKey){
  const l=eds(m), oi=l.findIndex(e=>e.id===curEd(m)?.id), ni=l.findIndex(e=>e.id===id); if(ni<0||oi===ni) return;
  const kind=activePlan(m)?.kind;
  ui.edByModel[m.id]=id;
  const plans=edPlans(curEd(m)); ui.planByModel[m.id]=(plans.find(p=>p.kind===kind)||plans[0])?.id;
  let chipEl=null;
  $$('#carTrack .car-chip').forEach(c=>{ const on=c.dataset.id===id; c.classList.toggle('on',on); c.setAttribute('aria-selected',on); if(on) chipEl=c; });
  placeThumb(true); ensureVisible(chipEl,true); if(fromKey) chipEl.focus();
  $('#mchips').innerHTML=mchipsHTML(m);
  const mc=$('#mcontent'); mc.innerHTML=contentHTML(m); mc.dataset.dir=ni>oi?'r':'l';
  mc.classList.remove('swap'); void mc.offsetWidth; mc.classList.add('swap'); refreshSummary();
}
function selected(p,iv){
  const out=[];
  for(const [sec,label] of SECS){ if(sec==='recs'&&!ui.withRecs) continue;
    for(const it of p[sec]) if(it.marks.includes(iv)&&!ui.excl.has(it.id)) out.push({...it,sec,label}); }
  return out;
}
function listHTML(m,p){
  const iv=activeIv(p), multi=p.intervals.length>1;
  const steps = multi?`<div class="steps" role="tablist" aria-label="Intervalo">${p.intervals.map(i=>`<button class="pill ${i.key===iv?'on':''}" data-act="iv" data-id="${i.key}">${esc(i.label)}</button>`).join('')}</div>`:'';
  const unmarked = p.kind==='revisao' ? p.parts.concat(p.labor).filter(x=>!x.marks.length).length : 0;
  const rows = SECS.map(([sec,label])=>{
    const items=(p[sec]||[]).filter(it=>it.marks.includes(iv)); if(!items.length) return '';
    return `<tr class="sec"><td colspan="4">${label}${sec==='recs'?' <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">— só entram na lista se ativados</span>':''}</td></tr>`
      + items.map(it=>{ const off=ui.excl.has(it.id)||(sec==='recs'&&!ui.withRecs);
        return `<tr class="${off?'off':''}"><td class="chk"><input type="checkbox" data-act="toggle" data-id="${it.id}" ${ui.excl.has(it.id)?'':'checked'} ${sec==='recs'&&!ui.withRecs?'disabled':''} aria-label="Incluir na lista"></td>
        <td>${esc(it.desc)||'<i style="color:var(--muted)">(sem descrição)</i>'}</td>
        <td>${it.code?`<button class="code" data-act="copy" data-code="${esc(it.code)}" title="Clique para copiar">${esc(it.code)}</button>`:'—'}</td>
        <td class="n">${fmtN(it.qty)}${sec==='labor'?(it.unit==='un'?'':' h'):''}</td></tr>`; }).join('');
  }).join('');
  const hasRecs=(p.recs||[]).some(it=>it.marks.includes(iv));
  return `${unmarked?`<p class="msg">${unmarked} item(ns) deste plano não estão marcados em nenhum intervalo. Ative o modo edição para ajustar.</p>`:''}${steps}
  ${hasRecs?`<label class="switch switchline"><input type="checkbox" id="recsToggle" class="sr" ${ui.withRecs?'checked':''}><i></i><span>Incluir recomendados</span></label>`:''}
  <div class="listcard"><div class="tablewrap"><table><thead><tr><th></th><th>Descrição</th><th>Código</th><th class="n">Qt / h</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty" style="padding:30px 16px">Nenhum item neste intervalo.</td></tr>'}</tbody></table></div></div>
  <p class="note">Clique em um código para copiá-lo. Desmarque os itens que não vão entrar no orçamento antes de copiar a lista.</p>`;
}
function refreshSummary(){
  const m=modelById(route().id); if(!m) return; const p=activePlan(m); const el=$('#summary'); if(!p||!el) return;
  const iv=activeIv(p), sel=selected(p,iv), lab=p.intervals.find(i=>i.key===iv)?.label||'';
  const nParts=sel.filter(x=>x.sec!=='labor').length, nLab=sel.filter(x=>x.sec==='labor').length;
  const hours=sel.filter(x=>x.sec==='labor'&&x.unit!=='un').reduce((a,x)=>a+x.qty,0);
  el.innerHTML=`<h3>Lista de códigos</h3><div class="iv">${esc(lab)}</div>
    <div class="srow"><span>Peças</span><b>${nParts}</b></div>
    <div class="srow"><span>Serviços</span><b>${nLab}</b></div>
    ${hours?`<div class="srow"><span>Tempo de mão de obra</span><b>${fmtN(hours)} h</b></div>`:''}
    <button class="btn" data-act="copylist">Copiar lista completa</button>
    <button class="btn ghost" data-act="copycodes">Copiar só os códigos</button>
    <p class="note">A lista completa copia <i>código · descrição · quantidade</i> separados por tabulação, pronto para colar no seu sistema ou em uma planilha.</p>`;
}

/* ---- editor de plano ---- */
const inp=(f,sec,id,val,cls='',ph='')=>`<input class="cell ${cls}" data-f="${f}" data-sec="${sec}" data-id="${id}" value="${esc(val)}" placeholder="${ph}">`;
function editorHTML(m,p){
  const ivs=p.intervals, span=ivs.length+5;
  const head=`<tr><th>Descrição</th><th>Código</th><th>Qt / h</th><th>Un.</th>${ivs.map(i=>`<th class="ivh"><div><input class="cell" data-ivl="${i.key}" value="${esc(i.label)}" aria-label="Nome do intervalo">${ivs.length>1?`<button class="xbtn" title="Remover intervalo" data-act="deliv" data-id="${i.key}">×</button>`:''}</div></th>`).join('')}<th><button class="btn sm ghost" data-act="addiv">+ Intervalo</button></th></tr>`;
  const body=SECS.map(([sec,label])=>{
    if(sec==='recs'&&!p.recs.length&&p.kind!=='pastilhas') return `<tr class="addrow"><td colspan="${span}"><button class="btn sm ghost" data-act="addrow" data-sec="${sec}">+ Adicionar “${label}”</button></td></tr>`;
    return `<tr class="sec"><td colspan="${span}">${label}</td></tr>`+p[sec].map(it=>`<tr>
      <td>${inp('desc',sec,it.id,it.desc)}</td><td>${inp('code',sec,it.id,it.code)}</td><td>${inp('qty',sec,it.id,numIn(it.qty),'qty')}</td>
      <td>${sec==='labor'?`<select class="cell" data-f="unit" data-sec="${sec}" data-id="${it.id}" style="width:74px"><option value="h" ${it.unit!=='un'?'selected':''}>h</option><option value="un" ${it.unit==='un'?'selected':''}>un</option></select>`:'<span class="cmeta">un</span>'}</td>
      ${ivs.map(i=>`<td class="mk"><input type="checkbox" data-mk="${i.key}" data-sec="${sec}" data-id="${it.id}" ${it.marks.includes(i.key)?'checked':''} aria-label="${esc(i.label)}"></td>`).join('')}
      <td><button class="xbtn" title="Remover linha" data-act="delrow" data-sec="${sec}" data-id="${it.id}">×</button></td></tr>`).join('')
      +`<tr class="addrow"><td colspan="${span}"><button class="btn sm ghost" data-act="addrow" data-sec="${sec}">+ Adicionar linha em “${label}”</button></td></tr>`;
  }).join('');
  return `<div class="plan-title"><div class="field"><label>Título do plano</label><input data-pf="title" value="${esc(p.title)}"></div><div class="field"><label>Nota (ex.: ERA)</label><input data-pf="note" value="${esc(p.note||'')}"></div></div>
  <div class="plan-bar"><button class="btn sm ghost" data-act="dupplan">Duplicar plano</button><button class="btn sm ghost" data-act="unlink">Desvincular desta versão</button><button class="btn sm danger" data-act="delplan">Excluir plano</button>${p.source?`<span class="cmeta">Origem: aba “${esc(p.source)}”</span>`:''}</div>
  <div class="listcard"><div class="tablewrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>

    const has=lb=>m.editions.some(e=>e.label.trim().toLowerCase()===lb.toLowerCase());
    const labels=[]; const y1=parseInt(fd.get('from_y'),10), y2=parseInt(fd.get('to_y'),10), one=fd.get('label').trim();
    if(y1&&y2){ if(y1>y2||y2-y1>40){ toast('Intervalo inválido (máx. 40 anos).'); return false; } for(let y=y1;y<=y2;y++) labels.push(y+' →'); }
    else if(one) labels.push(one); else { toast('Informe um ano ou um intervalo.'); return false; }
    const fresh=labels.filter(x=>!has(x)); if(!fresh.length){ toast('Esses anos já existem.'); return false; }
    let last=null;
    for(const label of fresh){
      const ne={id:'e-'+uid(),label,planIds:[]};
      if(src) ne.planIds=src.planIds.map(pid=>{ const p=planById(pid); if(!p) return null; if(p.kind==='pastilhas'&&share) return pid; const cp=clonePlan(p); db.plans.push(cp); return cp.id; }).filter(Boolean);
      m.editions.push(ne); last=ne;
    }
    ui.edByModel[m.id]=last.id; ui.planByModel[m.id]=planById(last.planIds[0])?.id; save(); render(); toast(fresh.length>1?fresh.length+' anos adicionados.':'Ano '+fresh[0]+' adicionado.');
  });
}
function editEdDialog(m){
  const e=curEd(m); if(!e) return;
  openDlg(`<h3>Editar ano</h3><div class="field"><label>Rótulo</label><input name="label" required value="${esc(e.label)}"></div>
    <div class="acts">${m.editions.length>1?'<button class="btn danger sp" value="del">Excluir este ano</button>':''}<button class="btn ghost" data-close>Cancelar</button><button class="btn" value="ok">Salvar</button></div>`,
  (fd,act)=>{
    if(act==='del'){
      if(!confirm('Excluir o ano '+e.label+' e os planos que só existem nele?')) return false;
      m.editions=m.editions.filter(x=>x.id!==e.id);
      const used=new Set(db.models.flatMap(x=>x.editions.flatMap(y=>y.planIds)));
      db.plans=db.plans.filter(p=>!e.planIds.includes(p.id)||used.has(p.id));
      delete ui.edByModel[m.id]; save(); render(); toast('Ano excluído.'); return;
    }
    const label=fd.get('label').trim(); if(!label) return false; e.label=label; save(); render();
  });
}
let rsT; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if($('#carView')){ placeThumb(false); carState(); } },80); });
initData();
render();
</script>
